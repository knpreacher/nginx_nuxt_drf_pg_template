services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -h 127.0.0.1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 60s

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx/nginx.hybrid.conf:/etc/nginx/conf.d/default.conf:ro
      - ./backend/app/media:/var/www/media:ro
    ports: ["80:80"]
    # host.docker.internal -> хост-машина
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  pg_data:
